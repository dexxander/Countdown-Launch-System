<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Launch Sequence</title>
  <desc id="desc">Futuristic cyan orbital ring around a magenta ignition core</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07172a" />
      <stop offset="1" stop-color="#120a2d" />
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67f7ff" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="core" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ec4899" />
      <stop offset="1" stop-color="#fb7185" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)" />
  <path d="M8 46h48M12 52h40" stroke="#67f7ff" stroke-opacity=".16" stroke-width="1" />
  <g filter="url(#glow)">
    <ellipse cx="32" cy="32" rx="22" ry="10" fill="none" stroke="url(#ring)" stroke-width="3" transform="rotate(-28 32 32)" />
    <path d="M32 15v34M15 32h34" stroke="#67f7ff" stroke-opacity=".3" stroke-width="1" />
    <circle cx="32" cy="32" r="9" fill="url(#core)" />
    <path d="m32 23 4 9-4 9-4-9 4-9Z" fill="#fff" fill-opacity=".92" />
  </g>
  <circle cx="51" cy="16" r="2" fill="#67f7ff" />
</svg>
